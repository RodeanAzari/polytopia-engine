<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Replay Viewer</title>
<!-- Replay viewer for poly-replay-1 files (tools/record.cpp, `make replay`). Self-contained, no game assets:
     plain shapes and letters on a square grid. Open this file in a browser and choose a replay, drop one on the
     page, or serve the repo and pass ?src=<path-or-url> (optional &frame=N, &view=T). -->
<style>
  :root {
    --surface: #fcfcfb; --panel: #f3f2ef; --ink: #0b0b0b; --ink2: #52514e; --line: #d9d8d3;
    --plain: #e4e0c8; --forest: #b9cf9a; --mountain: #b2aca0; --shallow: #a9cfe8; --deep: #6f9fcb;
    --village: #e4e0c8; --fog: #3a3a38; --hl: #f2c200;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--surface); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  header .meta { color: var(--ink2); }
  main { display: flex; flex-wrap: wrap; gap: 16px; padding: 16px; }
  #boardWrap { flex: 1 1 520px; min-width: 0; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; background: var(--surface); }
  aside { flex: 0 1 360px; min-width: 280px; display: flex; flex-direction: column; gap: 12px; }
  .card { background: var(--panel); border-radius: 8px; padding: 10px 12px; }
  .event { font-weight: 600; min-height: 2.8em; }
  .sub { color: var(--ink2); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: right; padding: 3px 4px; }
  th { color: var(--ink2); font-weight: 500; font-size: 12px; }
  td:first-child, th:first-child { text-align: left; }
  tr.active td { font-weight: 700; }
  .chip { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  button, select { font: inherit; padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px;
                   background: var(--surface); color: var(--ink); cursor: pointer; }
  input[type=range] { width: 100%; }
  .legend { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; font-size: 12px; color: var(--ink2); }
  #drop { padding: 48px 16px; text-align: center; color: var(--ink2); border: 2px dashed var(--line);
          border-radius: 8px; margin: 16px; }
  .hidden { display: none !important; }
  .vrow { display: grid; grid-template-columns: 3.2em 1fr; gap: 6px; align-items: center; font-size: 12px; margin-top: 4px; }
  .vrow .bar { height: 4px; background: var(--ink2); border-radius: 2px; margin-top: 2px; }
  .vrow.played { font-weight: 700; }
  .vrow.played .bar { background: var(--hl); }
  .vrow .pct { text-align: right; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <h1>Replay viewer</h1>
  <input type="file" id="file" accept=".json,application/json">
  <span class="meta" id="meta"></span>
</header>
<div id="drop">Choose a replay file (<code>make replay</code> writes <code>build/replays/*.json</code>) or drop it here.</div>
<main id="app" class="hidden">
  <div id="boardWrap"><canvas id="board"></canvas></div>
  <aside>
    <div class="card">
      <div class="sub" id="where"></div>
      <div class="event" id="event"></div>
    </div>
    <div class="card">
      <input type="range" id="slider" min="0" value="0" aria-label="Frame">
      <div class="controls">
        <button id="prevTurn" title="Previous turn (Shift+←)">« turn</button>
        <button id="prev" title="Previous frame (←)">‹</button>
        <button id="play" title="Play / pause (Space)">play</button>
        <button id="next" title="Next frame (→)">›</button>
        <button id="nextTurn" title="Next turn (Shift+→)">turn »</button>
        <select id="speed" aria-label="Speed">
          <option value="250">slow</option><option value="80" selected>normal</option><option value="15">fast</option>
        </select>
      </div>
      <div class="controls" style="margin-top:8px">
        <label for="view">View as</label>
        <select id="view"></select>
        <button id="png" title="Save the board as PNG">Save PNG</button>
      </div>
      <label class="controls" style="margin-top:8px"><input type="checkbox" id="showVisits" checked> Search visits (agent games)</label>
    </div>
    <div class="card hidden" id="visitsCard"></div>
    <div class="card"><table id="tribes"></table></div>
    <div class="card legend" id="legend"></div>
  </aside>
</main>
<script>
"use strict";
// Categorical slots 1-8, fixed order by tribe id (validated palette, light mode).
const TRIBE_COLORS = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"];
const TERRAIN = { ".": "--plain", "s": "--shallow", "d": "--deep", "m": "--mountain", "v": "--village",
                  "c": "--plain", "f": "--forest", "#": "--fog" };
const RESOURCE = { h: ["fish", "#2f6f9f"], f: ["fruit", "#c2417a"], a: ["animal", "#8a5a2b"],
                   w: ["whales", "#1d3f66"], o: ["ore", "#5d5d5d"], c: ["crops", "#b08a00"], r: ["ruins", "#7a3fb0"] };
const UNIT_LETTER = ["W", "R", "D", "S", "A", "C", "K", "M", "B", "Sh", "Bs", "G"];
const RESULT = ["won", "lost", ""];
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let replay = null, frames = [], cur = 0, timer = null;
const $ = id => document.getElementById(id);

function load(text, name) {
  const r = JSON.parse(text);
  if (r.format !== "poly-replay-1") throw new Error("not a poly-replay-1 file");
  // Carry omitted keys forward (record.cpp writes only keys that changed); d and hl are per frame.
  const full = [];
  let prev = {};
  for (const f of r.frames) {
    const merged = { ...prev, ...f };
    if (!("hl" in f)) delete merged.hl;
    if (!("vc" in f)) { delete merged.vc; delete merged.vt; }  // per decision, never carried
    full.push(merged);
    prev = merged;
  }
  replay = r; frames = full; cur = 0;
  const agents = r.agents ? ` · ${r.agents.map((a, i) => `${i}: ${a}`).join(" vs ")} · game seed ${r.game_seed}` : "";
  $("meta").textContent = `${name}${agents} · ${r.tribes.length} tribes · ${r.mode} · ${r.obs} obs · ${r.side}×${r.side} · seed ${r.seed} · ${frames.length} frames`;
  $("slider").max = frames.length - 1;
  const view = $("view");
  view.innerHTML = '<option value="-1">All (true state)</option>' +
    r.tribes.map((t, i) => `<option value="${i}">Tribe ${i} (${t})</option>`).join("");
  $("drop").classList.add("hidden");
  $("app").classList.remove("hidden");
  buildLegend();
  draw();
}

function buildLegend() {
  const items = [
    ["--plain", "plain"], ["--forest", "forest"], ["--mountain", "mountain"], ["--shallow", "shallow water"],
    ["--deep", "deep water"], ["--fog", "not visible to the selected tribe"]];
  $("legend").innerHTML = items.map(([v, l]) =>
    `<span class="chip" style="background:${css(v)}"></span><span>${l}</span>`).join("") +
    Object.values(RESOURCE).map(([l, c]) => `<span class="chip" style="background:${c};border-radius:50%"></span><span>${l}</span>`).join("") +
    `<span>W R D…</span><span>units: Warrior, Rider, Defender, Swordsman, Archer, Catapult, Knight, Mind bender, Boat, Ship, Battleship, Giant (super unit)</span>` +
    `<span>▣ 3</span><span>city and level; ★ capital; thick rim = walls; small letters = buildings</span>`;
}

function draw() {
  const f = frames[cur], n = replay.side, viewer = +$("view").value;
  const canvas = $("board");
  const px = Math.min(56, Math.floor(1100 / n));
  const size = n * px, dpr = window.devicePixelRatio || 1;
  canvas.width = size * dpr; canvas.height = size * dpr;
  canvas.style.maxWidth = size + "px";
  const g = canvas.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  const idx = (x, y) => x * n + y;            // Tribes' tile index; x is the row
  const seen = (x, y) => viewer < 0 || f.vis[viewer][idx(x, y)] === "1";
  const cx = y => y * px + px / 2, cy = x => x * px + px / 2;

  // Terrain, territory tint, roads, resources, buildings.
  for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) {
    const i = idx(x, y), t = f.ter[i];
    g.fillStyle = css(TERRAIN[t]);
    g.fillRect(y * px, x * px, px, px);
    if (t === "f") { tri(g, cx(y) - px * 0.15, cy(x) + px * 0.05, px * 0.16, "#7fa65a"); tri(g, cx(y) + px * 0.15, cy(x) + px * 0.12, px * 0.16, "#7fa65a"); }
    if (t === "m") tri(g, cx(y), cy(x) + px * 0.1, px * 0.32, "#8b8478");
    if (t === "v") { g.fillStyle = "#9b927e"; g.fillRect(cx(y) - px * 0.14, cy(x) - px * 0.1, px * 0.28, px * 0.22); }
  }
  const owner = new Map(f.cities.map(c => [c[0], c[1]]));
  for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) {
    const o = f.own[idx(x, y)];
    if (!o || !owner.has(o) || owner.get(o) < 0) continue;
    g.fillStyle = TRIBE_COLORS[owner.get(o)] + "2e";
    g.fillRect(y * px, x * px, px, px);
  }
  // Borders between differently owned tiles, in the owner's colour.
  g.lineWidth = 2;
  for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) {
    const o = f.own[idx(x, y)];
    if (!o || !owner.has(o)) continue;
    const tribe = owner.get(o);
    g.strokeStyle = TRIBE_COLORS[tribe];
    const other = (a, b) => a < 0 || b < 0 || a >= n || b >= n || owner.get(f.own[idx(a, b)]) !== tribe;
    g.beginPath();
    if (other(x - 1, y)) { g.moveTo(y * px, x * px + 1); g.lineTo((y + 1) * px, x * px + 1); }
    if (other(x + 1, y)) { g.moveTo(y * px, (x + 1) * px - 1); g.lineTo((y + 1) * px, (x + 1) * px - 1); }
    if (other(x, y - 1)) { g.moveTo(y * px + 1, x * px); g.lineTo(y * px + 1, (x + 1) * px); }
    if (other(x, y + 1)) { g.moveTo((y + 1) * px - 1, x * px); g.lineTo((y + 1) * px - 1, (x + 1) * px); }
    g.stroke();
  }
  g.strokeStyle = "#8a6a3a80"; g.lineWidth = Math.max(1.5, px * 0.04); g.lineCap = "round";
  const roadish = (x, y) => x >= 0 && y >= 0 && x < n && y < n && (f.road[idx(x, y)] === "1" || f.ter[idx(x, y)] === "c");
  for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) {
    if (f.road[idx(x, y)] !== "1" || "sd".includes(f.ter[idx(x, y)])) continue;
    let alone = true;
    for (let dx = -1; dx <= 1; ++dx) for (let dy = -1; dy <= 1; ++dy) {
      if ((dx || dy) && roadish(x + dx, y + dy) && !"sd".includes(f.ter[idx(x + dx, y + dy)])) {
        alone = false;
        g.beginPath(); g.moveTo(cx(y), cy(x)); g.lineTo(cx(y) + dy * px / 2, cy(x) + dx * px / 2); g.stroke();
      }
    }
    if (alone) { g.beginPath(); g.arc(cx(y), cy(x), px * 0.06, 0, 7); g.stroke(); }
  }
  g.font = `600 ${Math.max(8, px * 0.2)}px system-ui, sans-serif`;
  for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) {
    const i = idx(x, y);
    const r = RESOURCE[f.res[i]];
    if (r) { g.fillStyle = r[1]; g.beginPath(); g.arc(y * px + px * 0.18, x * px + px * 0.18, px * 0.09, 0, 7); g.fill(); }
    const b = f.bld[i];
    if (b !== "-") {
      const name = replay.buildings[b.charCodeAt(0) - 65];
      const abbr = name.split("_").map(w => w[0]).join("").slice(0, 2);
      g.fillStyle = "#ffffffcc"; g.fillRect(y * px + px * 0.52, x * px + px * 0.68, px * 0.44, px * 0.28);
      g.fillStyle = css("--ink"); g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(abbr, y * px + px * 0.74, x * px + px * 0.83);
    }
  }

  // Cities.
  for (const [id, tribe, x, y, level, pop, need, capital, walls] of f.cities) {
    if (tribe < 0 || !seen(x, y)) continue;
    const s = px * 0.62, x0 = cx(y) - s / 2, y0 = cy(x) - s / 2;
    g.fillStyle = TRIBE_COLORS[tribe];
    g.fillRect(x0, y0, s, s);
    g.lineWidth = walls ? Math.max(3, px * 0.1) : 1.5; g.strokeStyle = walls ? "#3b3b3b" : "#ffffff";
    g.strokeRect(x0, y0, s, s);
    g.fillStyle = "#ffffff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.max(9, px * 0.3)}px system-ui, sans-serif`;
    g.fillText(capital ? `★${level}` : `${level}`, cx(y), cy(x) - px * 0.04);
    // Population progress bar.
    g.fillStyle = "#ffffff88"; g.fillRect(x0 + 3, y0 + s - 6, s - 6, 3);
    g.fillStyle = "#ffffff"; g.fillRect(x0 + 3, y0 + s - 6, (s - 6) * Math.max(0, Math.min(1, pop / need)), 3);
  }
  // Units.
  for (const [id, type, tribe, x, y, hp, maxHp, vet, carried] of f.units) {
    if (!seen(x, y)) continue;
    const r = px * 0.22, ux = cx(y) + px * 0.22, uy = cy(x) + px * 0.2;
    g.fillStyle = TRIBE_COLORS[tribe];
    g.beginPath();
    if (carried >= 0) { g.moveTo(ux, uy - r); g.lineTo(ux + r, uy); g.lineTo(ux, uy + r); g.lineTo(ux - r, uy); g.closePath(); }
    else g.arc(ux, uy, r, 0, 7);
    g.fill();
    g.lineWidth = vet ? 3 : 1.5; g.strokeStyle = vet ? "#f2c200" : "#ffffff"; g.stroke();
    g.fillStyle = "#ffffff"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = `700 ${Math.max(8, px * 0.22)}px system-ui, sans-serif`;
    g.fillText(UNIT_LETTER[type], ux, uy + 0.5);
    if (maxHp > 0) {
      const w = px * 0.44, bx = ux - w / 2, by = Math.min(uy + r + 1, (x + 1) * px - 4);
      g.fillStyle = "#00000055"; g.fillRect(bx, by, w, 3);
      g.fillStyle = hp / maxHp > 0.5 ? "#1baf7a" : hp / maxHp > 0.25 ? "#eda100" : "#e34948";
      g.fillRect(bx, by, w * Math.max(0, hp / maxHp), 3);
    }
  }
  // Fog for the selected tribe.
  if (viewer >= 0) {
    g.fillStyle = css("--fog");
    for (let x = 0; x < n; ++x) for (let y = 0; y < n; ++y) if (!seen(x, y)) g.fillRect(y * px, x * px, px, px);
  }
  // This frame's action: actor tile -> target tile.
  if (f.hl) {
    const [x0, y0, x1, y1] = f.hl;
    g.strokeStyle = css("--hl"); g.lineWidth = 3;
    g.strokeRect(y0 * px + 1.5, x0 * px + 1.5, px - 3, px - 3);
    if (x0 !== x1 || y0 !== y1) {
      g.setLineDash([5, 4]); g.strokeRect(y1 * px + 1.5, x1 * px + 1.5, px - 3, px - 3); g.setLineDash([]);
      arrow(g, cx(y0), cy(x0), cx(y1), cy(x1), px * 0.3);
    }
  }
  if (f.vc && $("showVisits").checked) visitOverlay(g, f, px, cx, cy);
  // Grid.
  g.strokeStyle = "#00000014"; g.lineWidth = 1;
  for (let k = 0; k <= n; ++k) {
    g.beginPath(); g.moveTo(k * px + 0.5, 0); g.lineTo(k * px + 0.5, size); g.stroke();
    g.beginPath(); g.moveTo(0, k * px + 0.5); g.lineTo(size, k * px + 0.5); g.stroke();
  }
  panel(f);
}

// The search's most visited root actions for the decision that led to this frame (record.cpp vc):
// actor -> target arrows, width and opacity by visit share, the share printed on the target tile.
// The played action is the highlighted (hl) one; actions without a tile are listed in the panel only.
function visitOverlay(g, f, px, cx, cy) {
  const labels = new Map();
  for (const [x0, y0, x1, y1, visits, text] of f.vc) {
    const share = visits / f.vt;
    if (x0 < 0 || text === f.d) continue;  // no tile, or drawn as the played action
    const tx = x1 >= 0 ? x1 : x0, ty = x1 >= 0 ? y1 : y0;
    g.save();
    g.globalAlpha = 0.35 + 0.65 * Math.sqrt(share);
    g.strokeStyle = "#0b0b0b"; g.lineWidth = 1.5 + 6 * share;
    if (x1 >= 0 && (x1 !== x0 || y1 !== y0)) visitArrow(g, cx(y0), cy(x0), cx(ty), cy(tx), px * 0.3);
    else { g.beginPath(); g.arc(cx(ty), cy(tx), px * 0.36, 0, 7); g.stroke(); }
    g.restore();
    const key = `${tx},${ty}`;
    labels.set(key, (labels.get(key) || 0) + share);
  }
  const played = f.vc.find(e => e[5] === f.d);
  if (played && played[0] >= 0) {
    const tx = played[2] >= 0 ? played[2] : played[0], ty = played[2] >= 0 ? played[3] : played[1];
    const key = `${tx},${ty}`;
    labels.set(key, (labels.get(key) || 0) + played[4] / f.vt);
  }
  g.font = `700 ${Math.max(9, px * 0.22)}px system-ui, sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
  for (const [key, share] of labels) {
    if (share < 0.02) continue;  // arrows only: a label per tiny share is clutter
    const [tx, ty] = key.split(",").map(Number);
    const text = `${Math.round(100 * share)}%`, w = g.measureText(text).width + 6, h = px * 0.28;
    const bx = cx(ty) - w / 2, by = tx * px + 2;
    g.fillStyle = "#0b0b0bcc"; g.fillRect(bx, by, w, h);
    g.fillStyle = "#ffffff"; g.fillText(text, cx(ty), by + h / 2 + 0.5);
  }
}

function visitArrow(g, x0, y0, x1, y1, inset) {
  const a = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0) - inset;
  const ex = x0 + Math.cos(a) * len, ey = y0 + Math.sin(a) * len, head = 6 + g.lineWidth;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(ex - Math.cos(a) * head * 0.6, ey - Math.sin(a) * head * 0.6); g.stroke();
  g.beginPath(); g.moveTo(ex, ey);
  g.lineTo(ex - head * Math.cos(a - 0.45), ey - head * Math.sin(a - 0.45));
  g.lineTo(ex - head * Math.cos(a + 0.45), ey - head * Math.sin(a + 0.45));
  g.closePath(); g.fillStyle = g.strokeStyle; g.fill();
}

function tri(g, x, y, h, color) {
  g.fillStyle = color; g.beginPath();
  g.moveTo(x, y - h); g.lineTo(x + h * 0.8, y + h * 0.5); g.lineTo(x - h * 0.8, y + h * 0.5); g.closePath(); g.fill();
}

function arrow(g, x0, y0, x1, y1, inset) {
  const a = Math.atan2(y1 - y0, x1 - x0), len = Math.hypot(x1 - x0, y1 - y0) - inset;
  const ex = x0 + Math.cos(a) * len, ey = y0 + Math.sin(a) * len;
  g.beginPath(); g.moveTo(x0, y0); g.lineTo(ex, ey); g.stroke();
  g.beginPath(); g.moveTo(ex, ey);
  g.lineTo(ex - 9 * Math.cos(a - 0.5), ey - 9 * Math.sin(a - 0.5));
  g.lineTo(ex - 9 * Math.cos(a + 0.5), ey - 9 * Math.sin(a + 0.5));
  g.closePath(); g.fillStyle = css("--hl"); g.fill();
}

function panel(f) {
  const viewer = +$("view").value;
  $("slider").value = cur;
  const who = f.p >= 0 ? `tribe ${f.p} (${replay.tribes[f.p]})` : "";
  $("where").textContent = `Frame ${cur + 1} / ${frames.length} · turn ${f.t}${who ? " · " + who : ""}`;
  $("event").textContent = f.d;
  const card = $("visitsCard");
  card.classList.toggle("hidden", !f.vc);
  if (f.vc) {
    const agent = replay.agents ? replay.agents[f.p] : "search";
    const esc = t => t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
    card.innerHTML = `<div class="sub">${esc(agent)}: root visits of this decision (${f.vt}), top ${f.vc.length}</div>` +
      f.vc.map(([, , , , visits, text]) => {
        const share = visits / f.vt;
        return `<div class="vrow${text === f.d ? " played" : ""}"><span class="pct">${(100 * share).toFixed(1)}%</span>` +
          `<span>${esc(text)}<div class="bar" style="width:${Math.max(1, 100 * share)}%"></div></span></div>`;
      }).join("");
  }
  const counts = replay.tribes.map(() => ({ cities: 0, units: 0 }));
  for (const c of f.cities) if (c[1] >= 0) counts[c[1]].cities++;
  for (const u of f.units) counts[u[2]].units++;
  const last = cur === frames.length - 1;
  $("tribes").innerHTML = "<tr><th>Tribe</th><th>Stars</th><th>Score</th><th>Techs</th><th>Cities</th><th>Units</th><th></th></tr>" +
    f.tr.map(([stars, score, result, techs], i) => {
      // Viewing as a tribe: other tribes' stars, techs and totals are hidden, as in its observation (04 §7).
      const hide = v => (viewer >= 0 && viewer !== i ? "?" : v);
      return `<tr class="${i === f.p ? "active" : ""}"><td><span class="chip" style="background:${TRIBE_COLORS[i]}"></span>${i} ${replay.tribes[i]}</td>` +
      `<td>${hide(stars)}</td><td>${score}</td><td>${hide(techs)}</td><td>${hide(counts[i].cities)}</td><td>${hide(counts[i].units)}</td>` +
      `<td>${RESULT[result] || (last ? replay.result[i].toLowerCase() : "")}</td></tr>`;
    }).join("");
}

function go(k) { cur = Math.max(0, Math.min(frames.length - 1, k)); draw(); }
function turnStep(dir) {
  let k = cur + dir;
  while (k > 0 && k < frames.length - 1 && frames[k].e !== "start") k += dir;
  go(k);
}
function togglePlay() {
  if (timer) { clearInterval(timer); timer = null; $("play").textContent = "play"; return; }
  $("play").textContent = "pause";
  timer = setInterval(() => { if (cur >= frames.length - 1) togglePlay(); else go(cur + 1); }, +$("speed").value);
}

$("file").addEventListener("change", e => readFile(e.target.files[0]));
function readFile(file) {
  if (!file) return;
  file.text().then(t => load(t, file.name)).catch(err => alert("Could not load replay: " + err.message));
}
document.addEventListener("dragover", e => e.preventDefault());
document.addEventListener("drop", e => { e.preventDefault(); readFile(e.dataTransfer.files[0]); });
$("slider").addEventListener("input", e => go(+e.target.value));
$("prev").onclick = () => go(cur - 1);
$("next").onclick = () => go(cur + 1);
$("prevTurn").onclick = () => turnStep(-1);
$("nextTurn").onclick = () => turnStep(1);
$("play").onclick = togglePlay;
$("speed").onchange = () => { if (timer) { togglePlay(); togglePlay(); } };
$("view").onchange = draw;
$("showVisits").onchange = draw;
$("png").onclick = () => {
  const a = document.createElement("a");
  a.download = `replay-${replay.seed}-frame${cur + 1}.png`;
  a.href = $("board").toDataURL("image/png");
  a.click();
};
document.addEventListener("keydown", e => {
  if (!replay || e.target.tagName === "SELECT") return;
  if (e.key === "ArrowLeft") { e.shiftKey ? turnStep(-1) : go(cur - 1); e.preventDefault(); }
  if (e.key === "ArrowRight") { e.shiftKey ? turnStep(1) : go(cur + 1); e.preventDefault(); }
  if (e.key === " ") { togglePlay(); e.preventDefault(); }
});
const src = new URLSearchParams(location.search).get("src");
// ?frame=N (1-based) opens that frame, ?view=T views as tribe T: for captures (screenshots, GIFs).
const params = new URLSearchParams(location.search);
if (src) fetch(src).then(r => r.text()).then(t => {
  load(t, src);
  if (params.has("view")) $("view").value = params.get("view");
  go(+(params.get("frame") || 1) - 1);
}).catch(err => alert("Could not fetch " + src + ": " + err.message));
</script>
</body>
</html>
